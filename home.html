<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Booking System</title>
    <link rel="icon" href="icon.png">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-image: url('file:///C:/Users/Jenoprabakar/OneDrive/Desktop/programs/WEB/Screenshot%202025-01-22%20221347.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            font-family: Arial, sans-serif;
        }

        {
            cursor: url('custom-cursor.png'), auto;
        }

        header {
            padding: 10px;
            text-align: right;
            position: absolute;
            top: 10px;
            width: 100%;
            z-index: 1;
            background-color: rgba(0, 0, 0, 0.6); /* Semi-transparent black background */
        }

        header a {
            text-decoration: none;
            color: white; /* White text */
            font-size: 16px;
            margin: 0 10px;
            transition: color 0.3s;
    font-family:times new roman;

        }

        header a:hover {
            color: #FFD700; 
        }

        header span {
            color: white; 
            margin: 0 5px;
        }

        .welcome {
            margin-top: 100px; 
            text-align: center;
            color: black;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }

        h1, h2 {
            margin: 0;
        }

        button {
            background-color: rgb(59, 10, 124);
            color: white;
            border-radius: 25px;
            padding: 10px 40px;
            cursor: pointer;
            font-size: 16px;
            border: none;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: rgb(9, 14, 69);
        }

        button a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        marquee {
            color: red;
            font-weight: bold;
            font-size: 50px;
            font-family: 'Times New Roman', Times, serif;
            text-shadow: rgb(13, 219, 133)
        }

        /* Quote styling */
        .quote-container {
            text-align: center;
            margin-top: 40px;
            padding: 15px;
            background-color: rgba(0, 0, 0, 0.6); /* Semi-transparent background */
            border-radius: 10px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .quote-container p {
            padding: 8px;
            margin: 8px 0;
            width: 90%;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 1.1rem;
            color: white;
            font-style: italic;
        }

    </style>
</head>
<body>
    <header>
        <div>
            <a href="home.html">Home</a>
            <span>|</span>
            <a href="about us.html">About Us</a>
            <span>|</span>
            <a href="contact.html">Contact</a>
            <span>|</span>
            <a href="user register and login.html">Login/Sign In</a>
        </div>
    </header>

    <div class="welcome">
        <h1><b><i>Welcome to the World of Endless travel</i></b></h1>
        <div class="quote-container">
            <p>"Live life with no excuses, travel with no regret."</p>
        </div><br>
        <h2><i>Book and explore your dream destinations 🧳</i></h2><br>
        <marquee>Book your trip now</marquee><br><br>
        <button>
            <a href="user register and login.html">LOGIN</a>
        </button>
    </div>

   
</body>
</html>
