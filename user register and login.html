<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Login</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-image: url('file:///C:/Users/Jenoprabakar/OneDrive/Desktop/programs/WEB/Screenshot%202025-01-22%20221347.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      padding: 15px 0;
      text-align: right;
      z-index: 1000;
    }

    header a {
      text-decoration: none;
      color: white;
      font-size: 16px;
      margin: 0 15px;
      font-weight: bold;
      font-family: Times New Roman;
    }

    header a:hover {
      color: #FFD700;
    }

    button {
      background-color: rgb(59, 10, 124);
      color: white;
      border-radius: 25px;
      padding: 10px 40px;
      cursor: pointer;
      font-size: 16px;
      border: none;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: rgb(9, 14, 69);
    }

    button a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .login-container, .container {
      text-align: center;
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.8);
      border-radius: 10px;
      max-width: 350px;
      width: 100%;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    input {
      padding: 8px;
      margin: 8px 0;
      width: 90%;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    .login-container button,
    .container button {
      background-color: green;
      color: white;
      cursor: pointer;
      font-size: 1.1rem;
      border: none;
      padding: 10px;
      border-radius: 5px;
      width: 100%;
      margin-top: 10px;
    }

    .login-container button:hover,
    .container button:hover {
      background-color: darkgreen;
    }

    .error {
      color: red;
      font-size: 14px;
    }

    .success {
      color: limegreen;
    }

    .switch {
      cursor: pointer;
      color: #ccc;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <a href="home.html">Home</a> |
    <a href="about us.html">About Us</a> |
    <a href="contact.html">Contact</a> |
    <a href="user register and login.html">Login/Sign In</a>
  </header>

  <!-- Login Form -->
  <div class="login-container" id="loginContainer">
    <h1>Login</h1>
    <input type="text" id="loginUsername" placeholder="Enter Username" required><br>
    <input type="password" id="loginPassword" placeholder="Enter Password" required><br>
    <button onclick="loginUser()">Login</button>
    <p id="loginMessage" class="error"></p>
    <p class="switch" onclick="showRegister()">Not registered? Click here</p>
  </div>

  <!-- Registration Form -->
  <div class="container" id="registerContainer" style="display:none;">
    <h1>Register</h1>
    <input type="text" id="regUsername" placeholder="Enter Username" required><br>
    <input type="password" id="regPassword" placeholder="Enter Password" required><br>
    <button onclick="registerUser()">Register</button>
    <p id="regMessage" class="error"></p>
    <p class="switch" onclick="showLogin()">Already registered? Click here</p>
    <button>
      <a href="home.html">BACK TO HOMEPAGE</a>
    </button>
  </div>

  <script>
    function registerUser() {
      let username = document.getElementById("regUsername").value;
      let password = document.getElementById("regPassword").value;
      let regMessage = document.getElementById("regMessage");

      if (username.trim() === "" || password.trim() === "") {
        regMessage.innerHTML = "Username and Password cannot be empty!";
        return;
      }

      let users = JSON.parse(localStorage.getItem("users")) || {};
      if (users[username]) {
        regMessage.innerHTML = "Username already exists!";
        return;
      }

      users[username] = password;
      localStorage.setItem("users", JSON.stringify(users));

      regMessage.classList.remove("error");
      regMessage.classList.add("success");
      regMessage.innerHTML = "Registration Successful! Redirecting to Login...";
      setTimeout(() => {
        showLogin();
      }, 1500);
    }

    function loginUser() {
      let username = document.getElementById("loginUsername").value;
      let password = document.getElementById("loginPassword").value;
      let loginMessage = document.getElementById("loginMessage");

      let users = JSON.parse(localStorage.getItem("users")) || {};

      if (users[username] && users[username] === password) {
        loginMessage.classList.remove("error");
        loginMessage.classList.add("success");
        loginMessage.innerHTML = "Login Successful!";
        setTimeout(() => {
          window.location.href = "book.html"; // ✅ Redirecting correctly
        }, 1500);
      } else {
        loginMessage.classList.remove("success");
        loginMessage.classList.add("error");
        loginMessage.innerHTML = "Invalid Username or Password!";
      }
    }

    function showRegister() {
      document.getElementById("loginContainer").style.display = "none";
      document.getElementById("registerContainer").style.display = "block";
    }

    function showLogin() {
      document.getElementById("registerContainer").style.display = "none";
      document.getElementById("loginContainer").style.display = "block";
    }
  </script>
</body>
</html>
